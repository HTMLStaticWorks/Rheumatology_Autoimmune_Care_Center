<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient & Specialist Login — Rheumora</title>
  <meta name="description" content="Sign in to your Rheumora patient portal to view lab titers, upcoming infusion appointments, and message your care team.">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23184e5a'><path d='M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14h-2v-3H8v-2h3V8h2v3h3v2h-3z'/></svg>">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="auth-page-body">
  <div class="auth-page-actions" style="position: absolute; inset-block-start: var(--space-md); inset-inline-end: var(--space-md); display: flex; gap: var(--space-xs); z-index: 10;">
    <button type="button" class="btn-icon-square rtl-toggle-btn" aria-label="Toggle text direction" title="Toggle RTL layout">
      <i class="ph ph-arrows-left-right"></i>
    </button>
    <button type="button" class="btn-icon-square theme-toggle-btn" aria-label="Switch theme mode" title="Toggle Dark/Light mode">
      <i class="ph ph-moon"></i>
    </button>
  </div>

  <main class="auth-card">
    
    <!-- Logo -->
    <a href="index.html" class="auth-logo" style="text-decoration: none; color: inherit;">
      <span class="logo-symbol"><i class="ph ph-heartbeat"></i></span>
      <span>Rheumora</span>
    </a>

    <h1 class="auth-title">Patient & Clinician Portal</h1>
    <p class="auth-subtitle">Access your health records, lab biomarkers, and infusion bookings</p>

    <!-- Login Form with Step 12 Client-side Validation -->
    <form class="auth-form" data-validate="true" data-success-msg="Authentication successful. Redirecting to Patient Portal..." onsubmit="setTimeout(() => { window.location.href='dashboard.html'; }, 900);">
      
      <div class="alert-box"></div>

      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address <span class="required-star">*</span></label>
        <input type="email" id="loginEmail" name="email" class="form-control" placeholder="patient@example.com" required autocomplete="email">
        <span class="form-error-msg"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">
          <span>Password <span class="required-star">*</span></span>
        </label>
        <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Min. 8 characters" required autocomplete="current-password">
        <span class="form-error-msg"></span>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 0.85rem;">
          <div class="form-checkbox-row" style="margin-bottom: 0;">
            <input type="checkbox" id="loginRemember" name="remember">
            <label for="loginRemember" style="margin-bottom: 0;">Remember me</label>
          </div>
          <a href="#" style="color: var(--color-primary); text-decoration: underline;" onclick="alert('Password reset link has been dispatched to your email address.'); return false;">Forgot?</a>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;" data-original-text="Login">
        Login
      </button>

      <div class="auth-separator">
        <span>or</span>
      </div>

      <!-- Continue with Google (Official SVG) -->
      <button type="button" class="social-auth-btn" onclick="alert('Redirecting to Google Secure Authentication...');">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- Continue with Apple (Official SVG) -->
      <button type="button" class="social-auth-btn" onclick="alert('Redirecting to Apple ID Authentication...');">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.63 1.35-.57.65-1.06 1.72-.93 2.74 1 .08 2.01-.49 2.63-1.24z"/>
        </svg>
        <span>Continue with Apple</span>
      </button>

      <!-- Link to Register Page -->
      <div class="auth-footer-link">
        Don't have an account? <a href="register.html">Register here</a>
      </div>

    </form>

  </main>

  <!-- Script for form validation (no theme toggle per spec) -->
  <script src="assets/js/main.js"></script>
</body>
</html>
